name: ops-backup

on:
  schedule:
    # Воскресенье 03:00 UTC, плюс ручной запуск.
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # pinned, was @master

      - name: Pull prod DB
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Машина спит (min=0 + suspend): будим HTTP через прокси,
          # затем тянем с ретраями пока она стартует.
          curl -s -o /dev/null --max-time 90 https://wiki.slyrix.xyz/health || true
          for i in 1 2 3 4 5 6; do
            if flyctl sftp get /data/site.db ./site-prod.db -a slyrixwiki && [ -s ./site-prod.db ]; then break; fi
            echo "prod pull retry $i..."; if [ "$i" -lt 6 ]; then sleep 20; fi
          done
          test -s ./site-prod.db

      - name: Pull nightly DB
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -s -o /dev/null --max-time 90 https://nightly.slyrix.xyz/health || true
          for i in 1 2 3 4 5 6; do
            if flyctl sftp get /data/site.db ./site-nightly.db -a slyrixwiki-nightly && [ -s ./site-nightly.db ]; then break; fi
            echo "nightly pull retry $i..."; if [ "$i" -lt 6 ]; then sleep 20; fi
          done
          test -s ./site-nightly.db

      - name: Rename DBs with date
        run: |
          D=$(date -u +%F)
          mv site-prod.db site-stable-$D.db
          mv site-nightly.db site-nightly-$D.db
          ls -la site-*.db

      - name: Verify DB integrity
        run: |
          for f in site-stable-*.db site-nightly-*.db; do
            OUT=$(sqlite3 "$f" "PRAGMA integrity_check;" 2>&1)
            echo "$f: $OUT"
            [ "$OUT" = "ok" ] || exit 1
          done

      # Артефакты НЕ грузим: репа паблик, артефакты качает кто угодно,
      # а внутри сырые базы. Копии: файлы в ТГ + снапшоты вольюмов Fly.
      - name: Send DBs to Telegram
        env:
          OPS_BOT_TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          OPS_CHAT_ID: ${{ secrets.OPS_CHAT_ID }}
        run: |
          for f in site-stable-*.db site-nightly-*.db; do
            curl -s -f -o /dev/null -w "$f tg:%{http_code}\n" \
              -X POST "https://api.telegram.org/bot$OPS_BOT_TOKEN/sendDocument" \
              -F chat_id="$OPS_CHAT_ID" -F document=@"$f";
          done

      - name: Notify TG on failure
        if: failure()
        env:
          OPS_BOT_TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          OPS_CHAT_ID: ${{ secrets.OPS_CHAT_ID }}
        run: |
          curl -s -f -X POST "https://api.telegram.org/bot$OPS_BOT_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"$OPS_CHAT_ID\",\"text\":\"Бэкап FAILED — смотри Actions\"}" > /dev/null
