name: ops-backup

on:
  schedule:
    # Воскресенье 03:00 UTC, плюс ручной запуск.
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Pull prod DB
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Машина спит (min=0 + suspend): будим HTTP через прокси,
          # затем тянем с ретраями пока она стартует.
          curl -s -o /dev/null --max-time 90 https://wiki.slyrix.xyz/health || true
          for i in 1 2 3 4 5 6; do
            if flyctl sftp get /data/site.db ./site-prod.db -a slyrixwiki; then break; fi
            echo "prod pull retry $i, ждём 20с..."; sleep 20
          done
          test -f ./site-prod.db

      - name: Pull nightly DB
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -s -o /dev/null --max-time 90 https://nightly.slyrix.xyz/health || true
          for i in 1 2 3 4 5 6; do
            if flyctl sftp get /data/site.db ./site-nightly.db -a slyrixwiki-nightly; then break; fi
            echo "nightly pull retry $i, ждём 20с..."; sleep 20
          done
          test -f ./site-nightly.db

      - name: Rename DBs with date
        run: |
          D=$(date -u +%F)
          mv site-prod.db site-stable-$D.db
          mv site-nightly.db site-nightly-$D.db
          ls -la site-*.db

      - name: Verify DB integrity
        run: |
          for f in site-stable-*.db site-nightly-*.db; do
            OUT=$(sqlite3 "$f" "PRAGMA integrity_check;" 2>&1)
            echo "$f: $OUT"
            [ "$OUT" = "ok" ] || exit 1
          done

      - uses: actions/upload-artifact@v5
        with:
          name: site-dbs-${{ github.run_id }}
          path: |
            site-stable-*.db
            site-nightly-*.db
          retention-days: 30

      - name: Send DBs to Telegram
        env:
          OPS_BOT_TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          OPS_CHAT_ID: ${{ secrets.OPS_CHAT_ID }}
        run: |
          for f in site-stable-*.db site-nightly-*.db; do
            curl -s -o /dev/null -w "$f tg:%{http_code}\n" \
              -X POST "https://api.telegram.org/bot$OPS_BOT_TOKEN/sendDocument" \
              -F chat_id="$OPS_CHAT_ID" -F document=@"$f";
          done

      - name: Notify TG on failure
        if: failure()
        env:
          OPS_BOT_TOKEN: ${{ secrets.OPS_BOT_TOKEN }}
          OPS_CHAT_ID: ${{ secrets.OPS_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$OPS_BOT_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"$OPS_CHAT_ID\",\"text\":\"Бэкап FAILED — смотри Actions\"}" > /dev/null
